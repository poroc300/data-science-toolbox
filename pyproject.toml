[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "data-science-toolbox"
version = "1.0.0"
description = "Package with reusable statistical, machine learning, and data analysis utilities for data science workflows."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "André Lourenço", email = "andrelourenco300@gmail.com" }
]
keywords = ["data science", "statistics", "machine learning", "cloud", "data_viz"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
	"numpy>=2.4.4",
    "pandas>=3.0.2",
	"scikit-learn>=1.8.0",
	"seaborn>=0.13.2",
	"statsmodels>=0.14.6"
]
# Optional dependencies
[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
	"pinguoin"
]

[project.urls]
Homepage = "https://github.com/poroc300/data-science-utils"

# Tells hatchling where your source code lives
[tool.hatch.build.targets.wheel]
packages = ["src/dstools"]

# Ruff linter configuration
[tool.ruff]
line-length = 90

[tool.ruff.lint]
select = ["E", "F", "W"]        # E=pycodestyle errors, F=pyflakes, W=pycodestyle warnings
ignore = ["E501"]               # Ignore line length (handled by formatter)

[tool.ruff.format]
quote-style = "double"          # Enforce double quotes    

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"] # Ignore __init__.py files when running ruff check

# Pytest configuration — discovers tests in each submodule's tests folder
[tool.pytest.ini_options]
testpaths = [
    "src/dscience_toolbox/core_stats/tests",
	"src/dscience_toolbox/core_ml/tests",
	"src/dscience_toolbox/data_io/tests",
	"src/dscience_toolbox/maths/tests",
	"src/dscience_toolbox/utils/tests",
	"src/dscience_toolbox/visualisation/tests"
]